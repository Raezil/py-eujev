[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-eujev"
version = "0.1.0"
description = "A typed, standard-library Python SDK for the eu/jev System One API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["build>=1", "mypy>=1.10", "ruff>=0.6"]

[project.urls]
Documentation = "https://jev.bevel.software/docs"
"Python SDK" = "https://github.com/Bevel/py-eujev"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eujev = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/eujev", "examples"]
